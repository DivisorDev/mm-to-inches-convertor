<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiviTools - Ultimate Tools</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
.tab-active{border-bottom:3px solid #3b82f6;color:#3b82f6;}
  /* MOBILE INPUT FIX */
input, select {
  color: #000; /* light mode */
}

.dark input,
.dark select {
  background-color: #1f2937 !important; /* dark bg */
  color: #fff !important; /* white text */
  border: 1px solid #374151;
}

input::placeholder {
  color: #9ca3af;
}

.dark input::placeholder {
  color: #6b7280;
}
  
</style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-white">

<!-- HEADER -->input, select {
  font-size: 16px; /* mobile zoom issue fix */
}
<header class="p-4 bg-white dark:bg-gray-800 flex justify-between items-center">
<h1 class="font-bold text-lg">DiviTools - Divisor Studios</h1>
<button onclick="toggleDark()">🌙</button>
</header>

<div class="max-w-5xl mx-auto p-4">

<!-- TABS -->
<div class="flex gap-3 overflow-x-auto mb-6 text-sm">
<button onclick="tab(0)" class="tab tab-active">Length</button>
<button onclick="tab(1)" class="tab">Weight</button>
<button onclick="tab(2)" class="tab">Temp</button>
<button onclick="tab(3)" class="tab">Area</button>
<button onclick="tab(4)" class="tab">Speed</button>
<button onclick="tab(5)" class="tab">Calc</button>
<button onclick="tab(6)" class="tab">EMI</button>
<button onclick="tab(7)" class="tab">GST</button>
<button onclick="tab(8)" class="tab">Image</button>
</div>

<!-- LENGTH -->
<div id="c0">
<input id="val" type="number" placeholder="Value" oninput="convert()" class="w-full p-3 border rounded mb-2">
<select id="from" class="w-full p-2 border rounded mb-2">
<option value="mm">MM</option>
<option value="cm">CM</option>
<option value="m">Meter</option>
<option value="ft">Feet</option>
<option value="in">Inch</option>
</select>
<select id="to" class="w-full p-2 border rounded mb-2">
<option value="mm">MM</option>
<option value="cm">CM</option>
<option value="m">Meter</option>
<option value="ft">Feet</option>
<option value="in">Inch</option>
</select>
<div id="result" class="font-bold"></div>
<div id="fraction" class="text-blue-600"></div>
</div>

<!-- WEIGHT FIXED -->
<div id="c1" class="hidden">
<input id="w" type="number" placeholder="KG" class="w-full p-3 border rounded" oninput="weight()">
<div id="wr" class="mt-2"></div>
</div>

<!-- TEMP -->
<div id="c2" class="hidden">
<input id="t" type="number" placeholder="Celsius" class="w-full p-3 border rounded" oninput="temp()">
<div id="tr"></div>
</div>

<!-- AREA -->
<div id="c3" class="hidden">
<input id="a" type="number" class="w-full p-3 border rounded" oninput="area()">
<div id="ar"></div>
</div>

<!-- SPEED -->
<div id="c4" class="hidden">
<input id="s" type="number" class="w-full p-3 border rounded" oninput="speed()">
<div id="sr"></div>
</div>

<!-- CALCULATOR FIXED -->
<div id="c5" class="hidden">
<input id="calc" class="w-full p-3 border rounded" placeholder="2+2*5">
<button onclick="calcRes()" class="bg-blue-500 text-white px-4 py-2 mt-2 rounded w-full">Calculate</button>
<div id="calcResult" class="mt-2"></div>
</div>

<!-- EMI -->
<div id="c6" class="hidden">
<input id="p" placeholder="Loan" class="w-full p-2 border mb-2">
<input id="r" placeholder="Rate %" class="w-full p-2 border mb-2">
<input id="n" placeholder="Months" class="w-full p-2 border mb-2">
<button onclick="emi()" class="bg-blue-500 text-white px-4 py-2 w-full">Calculate</button>
<div id="emiResult"></div>
</div>

<!-- GST -->
<div id="c7" class="hidden">
<input id="gst" placeholder="Amount" class="w-full p-2 border mb-2">
<input id="gstp" placeholder="GST %" class="w-full p-2 border mb-2">
<button onclick="gstCalc()" class="bg-blue-500 text-white px-4 py-2 w-full">Add GST</button>
<div id="gstResult"></div>
</div>

<!-- IMAGE FIXED -->
<div id="c8" class="hidden">
<input type="file" accept="image/*" onchange="compress(event)" class="w-full mb-2">
<canvas id="canvas" class="w-full border"></canvas>
<button onclick="downloadImg()" class="bg-green-600 text-white px-4 py-2 mt-2 w-full">Download Image</button>
</div>

<!-- BUTTONS -->
<div class="mt-4 grid grid-cols-2 gap-2">
<button onclick="pdf()" class="bg-green-600 text-white p-2 rounded">PDF</button>
<button onclick="wa()" class="bg-green-500 text-white p-2 rounded">WhatsApp</button>
</div>

<!-- HISTORY -->
<div class="mt-6">
<h3 class="font-bold">History</h3>
<div id="historyBox" class="text-sm"></div>
</div>

</div>

<script>
function toggleDark(){document.documentElement.classList.toggle("dark");}

function tab(n){
document.querySelectorAll("[id^=c]").forEach(x=>x.classList.add("hidden"));
document.getElementById("c"+n).classList.remove("hidden");
}

/* LENGTH */
const rates={mm:1,cm:10,m:1000,ft:304.8,in:25.4};

function convert(){
let v=parseFloat(val.value)||0;
let res=(v*rates[from.value])/rates[to.value];
result.innerText=res.toFixed(3)+" "+to.value;

if(to.value=="in"){fraction.innerText=decimalToFraction(res);}
else{fraction.innerText="";}

saveHistory(v+" "+from.value+" → "+res.toFixed(2)+" "+to.value);
}

function decimalToFraction(d){
let w=Math.floor(d);
let f=d-w;
let fracs=[1/8,1/4,3/8,1/2,5/8,3/4,7/8];
let closest=fracs.reduce((a,b)=>Math.abs(b-f)<Math.abs(a-f)?b:a);
let num=Math.round(closest*8);
return w+" "+num+"/8 inch";
}

/* WEIGHT FIX */
function weight(){
let kg=parseFloat(w.value)||0;
wr.innerText=kg+" kg = "+(kg*1000)+" g | "+(kg*2.20462).toFixed(2)+" lb";
}

/* SAFE CALCULATOR */
function calcRes(){
try{
calcResult.innerText=Function('"use strict";return ('+calc.value+')')();
}catch{
calcResult.innerText="Invalid";
}
}

/* IMAGE FIX */
let imageData;
function compress(e){
let img=new Image();
img.src=URL.createObjectURL(e.target.files[0]);
img.onload=()=>{
let c=canvas;
let ctx=c.getContext("2d");
c.width=300;
c.height=300;
ctx.drawImage(img,0,0,300,300);
imageData=c.toDataURL("image/jpeg",0.7);
}
}

function downloadImg(){
if(imageData){
let a=document.createElement("a");
a.href=imageData;
a.download="compressed.jpg";
a.click();
}
}

/* HISTORY FIX */
function saveHistory(text){
let hist=JSON.parse(localStorage.getItem("hist"))||[];
hist.unshift(text);
hist=hist.slice(0,10);
localStorage.setItem("hist",JSON.stringify(hist));
renderHistory();
}

function renderHistory(){
let hist=JSON.parse(localStorage.getItem("hist"))||[];
historyBox.innerHTML=hist.map(x=>"<div>"+x+"</div>").join("");
}
window.onload=renderHistory;

/* OTHER */
function temp(){tr.innerText=(t.value*9/5+32)+" °F";}
function area(){ar.innerText=(a.value*10.76)+" sq.ft";}
function speed(){sr.innerText=(s.value*0.621)+" mph";}

/* EMI */
function emi(){
let P=p.value,R=r.value/12/100,N=n.value;
let E=(P*R*(1+R)**N)/((1+R)**N-1);
emiResult.innerText="EMI: "+E.toFixed(2);
}

/* GST */
function gstCalc(){
gstResult.innerText=(gst.value*(1+gstp.value/100)).toFixed(2);
}

/* PDF */
function pdf(){
const {jsPDF}=window.jspdf;
let doc=new jsPDF();
doc.text("Result: "+result.innerText,20,20);
doc.save("result.pdf");
}

/* WA */
function wa(){
window.open("https://wa.me/?text="+encodeURIComponent(window.location.href));
}
</script>

</body>
</html>
