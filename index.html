<-top:15px;
      opacity:.85
    }
  </style>
</head>
<body>
  <div class="card">
          <!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter | Divisor Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: system-ui, sans-serif; }
    .tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white dark:bg-gray-800 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-ruler text-3xl text-blue-600"></i>
        <h1 class="text-2xl font-bold">Divisor Studio</h1>
      </div>
      <h2 class="text-xl font-semibold hidden md:block">All-in-One Unit Converter</h2>
      <div class="flex items-center gap-4">
        <button onclick="toggleDarkMode()" class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700">
          <i id="theme-icon" class="fa-solid fa-moon text-2xl"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-6 py-8">
    <!-- Tabs -->
    <div class="flex border-b mb-6 overflow-x-auto">
      <button onclick="switchTab(0)" class="tab px-6 py-3 font-medium tab-active" id="tab-0">Length</button>
      <button onclick="switchTab(1)" class="tab px-6 py-3 font-medium" id="tab-1">Weight</button>
      <button onclick="switchTab(2)" class="tab px-6 py-3 font-medium" id="tab-2">Volume</button>
      <button onclick="switchTab(3)" class="tab px-6 py-3 font-medium" id="tab-3">Temperature</button>
      <button onclick="switchTab(4)" class="tab px-6 py-3 font-medium" id="tab-4">Fraction ↔ Decimal</button>
    </div>

    <!-- Tab Content -->
    <div id="tab-content">
      <!-- Length Tab (Default) -->
      <div id="content-0">
        <div class="grid md:grid-cols-2 gap-8">
          <div>
            <label class="block text-sm font-medium mb-2">From</label>
            <select id="from-unit" class="w-full p-4 rounded-2xl border dark:border-gray-700 bg-white dark:bg-gray-800 text-lg">
              <option value="mm">Millimeter (mm)</option>
              <option value="cm">Centimeter (cm)</option>
              <option value="m">Meter (m)</option>
              <option value="ft">Feet (ft)</option>
              <option value="in" selected>Inch (in)</option>
            </select>
            <input id="from-value" type="text" placeholder="Enter value" 
                   class="w-full mt-4 p-6 text-4xl rounded-3xl border dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-4 focus:ring-blue-300"
                   oninput="convertLength()">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">To</label>
            <select id="to-unit" class="w-full p-4 rounded-2xl border dark:border-gray-700 bg-white dark:bg-gray-800 text-lg">
              <option value="mm" selected>Millimeter (mm)</option>
              <option value="cm">Centimeter (cm)</option>
              <option value="m">Meter (m)</option>
              <option value="ft">Feet (ft)</option>
              <option value="in">Inch (in)</option>
            </select>
            <div class="mt-4 p-6 bg-white dark:bg-gray-800 rounded-3xl border dark:border-gray-700 text-4xl min-h-[100px] flex items-center" id="to-value">
              0
            </div>
            <div id="fraction-result" class="mt-3 text-2xl font-medium text-blue-600"></div>
          </div>
        </div>
        <button onclick="swapUnits()" class="mx-auto mt-6 flex items-center gap-2 bg-blue-600 text-white px-8 py-3 rounded-2xl hover:bg-blue-700">
          <i class="fa-solid fa-arrows-rotate"></i> Swap Units
        </button>
      </div>

      <!-- Weight, Volume, Temperature tabs will load dynamically via JS -->
      <!-- Fraction Tab -->
      <div id="content-4" class="hidden">
        <div class="max-w-md mx-auto bg-white dark:bg-gray-800 rounded-3xl p-8">
          <h3 class="text-2xl font-semibold mb-6 text-center">Fraction ↔ Decimal</h3>
          <input id="frac-input" type="text" placeholder="e.g. 5 3/8 or 5.375" 
                 class="w-full p-5 text-3xl rounded-2xl border dark:border-gray-700" oninput="convertFraction()">
          <div id="frac-result" class="mt-8 text-4xl font-bold text-center text-blue-600 min-h-[80px]"></div>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-wrap gap-4 justify-center mt-10">
      <button onclick="copyResult()" 
              class="flex items-center gap-2 bg-gray-800 dark:bg-gray-700 text-white px-6 py-3 rounded-2xl hover:bg-black">
        <i class="fa-solid fa-copy"></i> Copy Result
      </button>
      <button onclick="exportToPDF()" 
              class="flex items-center gap-2 bg-green-600 text-white px-6 py-3 rounded-2xl hover:bg-green-700">
        <i class="fa-solid fa-file-pdf"></i> Export to PDF
      </button>
      <button onclick="shareLink()" 
              class="flex items-center gap-2 bg-purple-600 text-white px-6 py-3 rounded-2xl hover:bg-purple-700">
        <i class="fa-solid fa-share"></i> Share Link
      </button>
    </div>

    <!-- History -->
    <div class="mt-12">
      <h3 class="font-medium mb-4 flex items-center gap-2"><i class="fa-solid fa-clock"></i> Recent Conversions</h3>
      <div id="history" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-white dark:bg-gray-800 border-t mt-16 py-10">
    <div class="max-w-6xl mx-auto px-6 text-center">
      <p class="text-xl font-semibold mb-2">Divisor Studio</p>
      <p class="text-sm text-gray-500 dark:text-gray-400">© All Rights Reserved by Divisor Studio</p>
      <p class="mt-6 text-sm">
        Connect with us: 
        <a href="mailto:divisordevelopment@gmail.com" class="text-blue-600 hover:underline font-medium">
          divisordevelopment@gmail.com
        </a>
      </p>
      <p class="text-xs mt-8 text-gray-400">Made with ❤️ for makers, engineers & DIY lovers</p>
    </div>
  </footer>

  <script>
    // Tailwind script
    function initTailwind() {
      tailwind.config = { content: ["*"], darkMode: "class" };
    }

    let currentTab = 0;
    const conversionRates = {
      length: { mm: 1, cm: 10, m: 1000, ft: 304.8, in: 25.4 }
    };

    function convertLength() {
      const fromVal = parseFloat(document.getElementById("from-value").value) || 0;
      const fromUnit = document.getElementById("from-unit").value;
      const toUnit = document.getElementById("to-unit").value;

      const mmValue = fromVal * conversionRates.length[fromUnit];
      let result = mmValue / conversionRates.length[toUnit];

      document.getElementById("to-value").innerHTML = result.toFixed(6);

      // Fraction for inches
      if (toUnit === "in") {
        const fraction = decimalToFraction(result);
        document.getElementById("fraction-result").innerHTML = 
          `<span class="text-lg">= ${fraction}</span>`;
      } else {
        document.getElementById("fraction-result").innerHTML = "";
      }

      addToHistory(`Length: ${fromVal} ${fromUnit} → ${result.toFixed(4)} ${toUnit}`);
    }

    function decimalToFraction(decimal) {
      if (decimal === 0) return "0";
      const whole = Math.floor(decimal);
      let frac = decimal - whole;
      const denominators = [16, 32, 64];
      let best = "";
      let minDiff = 1;
      for (let den of denominators) {
        let num = Math.round(frac * den);
        let diff = Math.abs(frac - num/den);
        if (diff < minDiff) {
          minDiff = diff;
          best = num === 0 ? "" : `\( {num}/ \){den}`;
        }
      }
      return whole + (best ? " " + best : "");
    }

    function swapUnits() {
      const from = document.getElementById("from-unit");
      const to = document.getElementById("to-unit");
      const temp = from.value;
      from.value = to.value;
      to.value = temp;
      convertLength();
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle("dark");
      const icon = document.getElementById("theme-icon");
      icon.classList.toggle("fa-moon");
      icon.classList.toggle("fa-sun");
      localStorage.setItem("darkMode", document.documentElement.classList.contains("dark"));
    }

    function switchTab(n) {
      currentTab = n;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("tab-active"));
      document.getElementById("tab-" + n).classList.add("tab-active");

      document.querySelectorAll("#tab-content > div").forEach(div => div.classList.add("hidden"));
      document.getElementById("content-" + n).classList.remove("hidden");

      if (n === 0) convertLength();
    }

    function convertFraction() {
      const input = document.getElementById("frac-input").value.trim();
      let resultHTML = "";

      // Decimal to fraction
      if (/^\d*\.?\d+$/.test(input)) {
        const dec = parseFloat(input);
        resultHTML = `Fraction: <span class="text-5xl">${decimalToFraction(dec)}</span>`;
      }
      // Fraction to decimal (e.g. 5 3/8)
      else if (input.includes("/")) {
        const parts = input.replace(/ /g, "").split("/");
        if (parts.length === 2) {
          const num = parseFloat(parts[0]);
          const den = parseFloat(parts[1]);
          const dec = num / den;
          resultHTML = `Decimal: <span class="text-5xl">${dec.toFixed(4)}</span>`;
        }
      }
      document.getElementById("frac-result").innerHTML = resultHTML || "Enter fraction like 5 3/8 or decimal";
    }

    function addToHistory(text) {
      const historyDiv = document.getElementById("history");
      const item = document.createElement("div");
      item.className = "bg-white dark:bg-gray-800 p-4 rounded-2xl text-sm border dark:border-gray-700";
      item.innerHTML = text;
      historyDiv.prepend(item);
      if (historyDiv.children.length > 8) historyDiv.lastElementChild.remove();
    }

    function copyResult() {
      const result = document.getElementById("to-value").innerText || document.getElementById("frac-result").innerText;
      navigator.clipboard.writeText(result).then(() => {
        alert("✅ Copied to clipboard!");
      });
    }

    function exportToPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(20);
      doc.text("Divisor Studio Unit Converter", 20, 30);
      doc.setFontSize(14);
      doc.text(`Conversion Result: ${document.getElementById("to-value").innerText || "Fraction result"}`, 20, 60);
      doc.text("© All Rights Reserved by Divisor Studio", 20, 100);
      doc.save("divisor-studio-conversion.pdf");
    }

    function shareLink() {
      const url = window.location.href + "?tab=" + currentTab;
      navigator.clipboard.writeText(url).then(() => alert("🔗 Link copied! Share kar do"));
    }

    // Load dark mode
    if (localStorage.getItem("darkMode") === "true") {
      document.documentElement.classList.add("dark");
      document.getElementById("theme-icon").classList.replace("fa-moon", "fa-sun");
    }

    initTailwind();
    // Default load
    window.onload = () => {
      convertLength();
    };
  </script>
</body>
</html>
