<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter | Divisor Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: system-ui, sans-serif; }
    .tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: 600; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white dark:bg-gray-800 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-ruler text-3xl text-blue-600"></i>
        <h1 class="text-2xl font-bold">Divisor Studio</h1>
      </div>
      <h2 class="text-xl font-semibold hidden md:block">All-in-One Unit Converter</h2>
      <button onclick="toggleDarkMode()" class="p-3 rounded-2xl hover:bg-gray-200 dark:hover:bg-gray-700">
        <i id="theme-icon" class="fa-solid fa-moon text-2xl"></i>
      </button>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-6 py-8">
    <!-- Tabs -->
    <div class="flex border-b mb-8 overflow-x-auto pb-1">
      <button onclick="switchTab(0)" class="tab px-8 py-4 tab-active" id="tab-0">Length</button>
      <button onclick="switchTab(1)" class="tab px-8 py-4" id="tab-1">Weight</button>
      <button onclick="switchTab(2)" class="tab px-8 py-4" id="tab-2">Volume</button>
      <button onclick="switchTab(3)" class="tab px-8 py-4" id="tab-3">Temperature</button>
      <button onclick="switchTab(4)" class="tab px-8 py-4" id="tab-4">Fraction ↔ Decimal</button>
    </div>

    <div id="tab-content">

      <!-- Length Tab -->
      <div id="content-0">
        <div class="grid md:grid-cols-2 gap-8">
          <div>
            <label class="block text-sm font-medium mb-2">From</label>
            <select id="from-unit-l" class="w-full p-4 rounded-2xl border dark:border-gray-700 bg-white dark:bg-gray-800">
              <option value="mm">Millimeter (mm)</option>
              <option value="cm">Centimeter (cm)</option>
              <option value="m">Meter (m)</option>
              <option value="ft">Feet (ft)</option>
              <option value="in" selected>Inch (in)</option>
            </select>
            <input id="from-value-l" type="number" step="any" placeholder="Value" 
                   class="w-full mt-4 p-6 text-4xl rounded-3xl border dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-4 focus:ring-blue-300"
                   oninput="convertLength()">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">To</label>
            <select id="to-unit-l" class="w-full p-4 rounded-2xl border dark:border-gray-700 bg-white dark:bg-gray-800">
              <option value="mm" selected>Millimeter (mm)</option>
              <option value="cm">Centimeter (cm)</option>
              <option value="m">Meter (m)</option>
              <option value="ft">Feet (ft)</option>
              <option value="in">Inch (in)</option>
            </select>
            <div class="mt-4 p-6 bg-white dark:bg-gray-800 rounded-3xl border dark:border-gray-700 text-4xl min-h-[110px] flex items-center" id="to-value-l">0</div>
            <div id="fraction-result" class="mt-3 text-2xl font-medium text-blue-600"></div>
          </div>
        </div>
        <button onclick="swapLength()" class="mx-auto mt-6 flex items-center gap-2 bg-blue-600 text-white px-8 py-3 rounded-2xl hover:bg-blue-700">
          <i class="fa-solid fa-arrows-rotate"></i> Swap
        </button>
      </div>

      <!-- Weight Tab -->
      <div id="content-1" class="hidden">
        <div class="grid md:grid-cols-2 gap-8">
          <div>
            <label class="block text-sm font-medium mb-2">From</label>
            <select id="from-unit-w" class="w-full p-4 rounded-2xl border dark:border-gray-700 bg-white dark:bg-gray-800">
              <option value="kg" selected>Kilogram (kg)</option>
              <option value="g">Gram (g)</option>
              <option value="lb">Pound (lb)</option>
              <option value="oz">Ounce (oz)</option>
              <option value="ton">Metric Ton</option>
            </select>
            <input id="from-value-w" type="number" step="any" placeholder="Value" 
                   class="w-full mt-4 p-6 text-4xl rounded-3xl border dark:border-gray-700 bg-white dark:bg-gray-800" oninput="convertWeight()">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">To</label>
            <select id="to-unit-w" class="w-full p-4 rounded-2xl border dark:border-gray-700 bg-white dark:bg-gray-800">
              <option value="kg">Kilogram (kg)</option>
              <option value="g" selected>Gram (g)</option>
              <option value="lb">Pound (lb)</option>
              <option value="oz">Ounce (oz)</option>
              <option value="ton">Metric Ton</option>
            </select>
            <div class="mt-4 p-6 bg-white dark:bg-gray-800 rounded-3xl border dark:border-gray-700 text-4xl min-h-[110px] flex items-center" id="to-value-w">0</div>
          </div>
        </div>
      </div>

      <!-- Volume Tab -->
      <div id="content-2" class="hidden">
        <div class="grid md:grid-cols-2 gap-8">
          <div>
            <label class="block text-sm font-medium mb-2">From</label>
            <select id="from-unit-v" class="w-full p-4 rounded-2xl border dark:border-gray-700 bg-white dark:bg-gray-800">
              <option value="l" selected>Liter (L)</option>
              <option value="ml">Milliliter (ml)</option>
              <option value="m3">Cubic Meter (m³)</option>
              <option value="gal">US Gallon</option>
              <option value="ft3">Cubic Feet</option>
            </select>
            <input id="from-value-v" type="number" step="any" placeholder="Value" 
                   class="w-full mt-4 p-6 text-4xl rounded-3xl border dark:border-gray-700 bg-white dark:bg-gray-800" oninput="convertVolume()">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">To</label>
            <select id="to-unit-v" class="w-full p-4 rounded-2xl border dark:border-gray-700 bg-white dark:bg-gray-800">
              <option value="l">Liter (L)</option>
              <option value="ml" selected>Milliliter (ml)</option>
              <option value="m3">Cubic Meter (m³)</option>
              <option value="gal">US Gallon</option>
              <option value="ft3">Cubic Feet</option>
            </select>
            <div class="mt-4 p-6 bg-white dark:bg-gray-800 rounded-3xl border dark:border-gray-700 text-4xl min-h-[110px] flex items-center" id="to-value-v">0</div>
          </div>
        </div>
      </div>

      <!-- Temperature Tab -->
      <div id="content-3" class="hidden">
        <div class="grid md:grid-cols-2 gap-8">
          <div>
            <label class="block text-sm font-medium mb-2">From</label>
            <select id="from-unit-t" class="w-full p-4 rounded-2xl border dark:border-gray-700 bg-white dark:bg-gray-800">
              <option value="c" selected>Celsius (°C)</option>
              <option value="f">Fahrenheit (°F)</option>
              <option value="k">Kelvin (K)</option>
            </select>
            <input id="from-value-t" type="number" step="any" placeholder="Value" 
                   class="w-full mt-4 p-6 text-4xl rounded-3xl border dark:border-gray-700 bg-white dark:bg-gray-800" oninput="convertTemperature()">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">To</label>
            <select id="to-unit-t" class="w-full p-4 rounded-2xl border dark:border-gray-700 bg-white dark:bg-gray-800">
              <option value="c">Celsius (°C)</option>
              <option value="f" selected>Fahrenheit (°F)</option>
              <option value="k">Kelvin (K)</option>
            </select>
            <div class="mt-4 p-6 bg-white dark:bg-gray-800 rounded-3xl border dark:border-gray-700 text-4xl min-h-[110px] flex items-center" id="to-value-t">0</div>
          </div>
        </div>
      </div>

      <!-- Fraction Tab -->
      <div id="content-4" class="hidden">
        <div class="max-w-lg mx-auto bg-white dark:bg-gray-800 rounded-3xl p-10">
          <h3 class="text-2xl font-semibold mb-6 text-center">Fraction to Decimal & Vice Versa</h3>
          <input id="frac-input" type="text" placeholder="Example: 5 3/8  or  5.375" 
                 class="w-full p-6 text-3xl rounded-3xl border dark:border-gray-700 bg-white dark:bg-gray-800" oninput="convertFraction()">
          <div id="frac-result" class="mt-10 text-5xl font-bold text-center text-blue-600 min-h-[100px]"></div>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-wrap gap-4 justify-center mt-12">
      <button onclick="copyResult()" class="flex items-center gap-2 bg-gray-800 dark:bg-gray-700 hover:bg-black text-white px-7 py-3.5 rounded-2xl">
        <i class="fa-solid fa-copy"></i> Copy Result
      </button>
      <button onclick="exportToPDF()" class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-7 py-3.5 rounded-2xl">
        <i class="fa-solid fa-file-pdf"></i> Export PDF
      </button>
      <button onclick="shareLink()" class="flex items-center gap-2 bg-purple-600 hover:bg-purple-700 text-white px-7 py-3.5 rounded-2xl">
        <i class="fa-solid fa-share"></i> Share Link
      </button>
      <!-- WhatsApp Share Button -->
      <button onclick="shareOnWhatsApp()" 
              class="flex items-center gap-2 bg-[#25D366] hover:bg-[#128C7E] text-white px-7 py-3.5 rounded-2xl font-medium">
        <i class="fa-brands fa-whatsapp text-2xl"></i> 
        Share on WhatsApp
      </button>
    </div>

    <!-- History -->
    <div class="mt-16">
      <h3 class="font-medium mb-4 flex items-center gap-2"><i class="fa-solid fa-clock"></i> Recent Conversions</h3>
      <div id="history" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-white dark:bg-gray-800 border-t mt-20 py-12">
    <div class="max-w-6xl mx-auto px-6 text-center">
      <p class="text-2xl font-semibold mb-1">Divisor Studio</p>
      <p class="text-sm text-gray-500 dark:text-gray-400">© All Rights Reserved by Divisor Studio</p>
      <p class="mt-6">
        Connect with us: 
        <a href="mailto:divisordevelopment@gmail.com" class="text-blue-600 hover:underline">divisordevelopment@gmail.com</a>
      </p>
    </div>
  </footer>

  <script>
    // Dark Mode
    function toggleDarkMode() {
      document.documentElement.classList.toggle("dark");
      const icon = document.getElementById("theme-icon");
      icon.classList.toggle("fa-moon");
      icon.classList.toggle("fa-sun");
      localStorage.setItem("darkMode", document.documentElement.classList.contains("dark"));
    }

    let currentTab = 0;

    function switchTab(n) {
      currentTab = n;
      document.querySelectorAll(".tab").forEach((t, i) => {
        t.classList.toggle("tab-active", i === n);
      });
      document.querySelectorAll("#tab-content > div").forEach(div => div.classList.add("hidden"));
      document.getElementById("content-" + n).classList.remove("hidden");

      // Auto convert on tab switch
      if (n === 0) convertLength();
      else if (n === 1) convertWeight();
      else if (n === 2) convertVolume();
      else if (n === 3) convertTemperature();
    }

    // Length Converter
    const lengthRates = { mm: 1, cm: 10, m: 1000, ft: 304.8, in: 25.4 };
    function convertLength() {
      let val = parseFloat(document.getElementById("from-value-l").value) || 0;
      let from = document.getElementById("from-unit-l").value;
      let to = document.getElementById("to-unit-l").value;
      let result = (val * lengthRates[from]) / lengthRates[to];
      document.getElementById("to-value-l").textContent = result.toFixed(6);

      if (to === "in") {
        document.getElementById("fraction-result").innerHTML = `≈ ${decimalToFraction(result)}`;
      } else {
        document.getElementById("fraction-result").innerHTML = "";
      }
      addToHistory(`Length: ${val} ${from} → ${result.toFixed(4)} ${to}`);
    }
    function swapLength() {
      let f = document.getElementById("from-unit-l");
      let t = document.getElementById("to-unit-l");
      [f.value, t.value] = [t.value, f.value];
      convertLength();
    }

    // Weight Converter
    const weightRates = { kg: 1, g: 0.001, lb: 0.453592, oz: 0.0283495, ton: 1000 };
    function convertWeight() {
      let val = parseFloat(document.getElementById("from-value-w").value) || 0;
      let from = document.getElementById("from-unit-w").value;
      let to = document.getElementById("to-unit-w").value;
      let result = (val * weightRates[from]) / weightRates[to];
      document.getElementById("to-value-w").textContent = result.toFixed(6);
      addToHistory(`Weight: ${val} ${from} → ${result.toFixed(4)} ${to}`);
    }

    // Volume Converter
    const volumeRates = { l: 1, ml: 0.001, m3: 1000, gal: 3.78541, ft3: 28.3168 };
    function convertVolume() {
      let val = parseFloat(document.getElementById("from-value-v").value) || 0;
      let from = document.getElementById("from-unit-v").value;
      let to = document.getElementById("to-unit-v").value;
      let result = (val * volumeRates[from]) / volumeRates[to];
      document.getElementById("to-value-v").textContent = result.toFixed(6);
      addToHistory(`Volume: ${val} ${from} → ${result.toFixed(4)} ${to}`);
    }

    // Temperature Converter
    function convertTemperature() {
      let val = parseFloat(document.getElementById("from-value-t").value) || 0;
      let from = document.getElementById("from-unit-t").value;
      let to = document.getElementById("to-unit-t").value;
      let result;

      if (from === to) result = val;
      else if (from === "c" && to === "f") result = (val * 9/5) + 32;
      else if (from === "f" && to === "c") result = (val - 32) * 5/9;
      else if (from === "c" && to === "k") result = val + 273.15;
      else if (from === "k" && to === "c") result = val - 273.15;
      else if (from === "f" && to === "k") result = (val - 32) * 5/9 + 273.15;
      else if (from === "k" && to === "f") result = (val - 273.15) * 9/5 + 32;

      document.getElementById("to-value-t").textContent = result.toFixed(4);
      addToHistory(`Temperature: ${val} ${from} → ${result.toFixed(4)} ${to}`);
    }

    // Fraction Converter
    function decimalToFraction(dec) {
      if (!dec) return "0";
      let whole = Math.floor(dec);
      let frac = dec - whole;
      let best = "";
      let minDiff = 1;
      [16,32,64].forEach(den => {
        let num = Math.round(frac * den);
        let diff = Math.abs(frac - num/den);
        if (diff < minDiff) {
          minDiff = diff;
          best = num ? `\( {num}/ \){den}` : "";
        }
      });
      return whole + (best ? " " + best : "");
    }

    function convertFraction() {
      let input = document.getElementById("frac-input").value.trim();
      let res = "";

      if (/^\d*\.?\d+$/.test(input)) {
        res = `Fraction: <span class="text-5xl">${decimalToFraction(parseFloat(input))}</span>`;
      } else if (input.includes("/")) {
        let parts = input.split(" ");
        let fracPart = parts[parts.length-1].split("/");
        if (fracPart.length === 2) {
          let num = parseFloat(fracPart[0]);
          let den = parseFloat(fracPart[1]);
          let decimal = num / den;
          if (parts.length > 1) decimal += parseFloat(parts[0]);
          res = `Decimal: <span class="text-5xl">${decimal.toFixed(6)}</span>`;
        }
      }
      document.getElementById("frac-result").innerHTML = res || "Enter something like 5 3/8 or 2.375";
    }

    function addToHistory(text) {
      const hist = document.getElementById("history");
      const div = document.createElement("div");
      div.className = "bg-white dark:bg-gray-800 p-4 rounded-2xl text-sm border dark:border-gray-700";
      div.textContent = text;
      hist.prepend(div);
      if (hist.children.length > 9) hist.removeChild(hist.lastChild);
    }

    function copyResult() {
      let text = "";
      if (currentTab === 0) text = document.getElementById("to-value-l").textContent;
      else if (currentTab === 1) text = document.getElementById("to-value-w").textContent;
      else if (currentTab === 2) text = document.getElementById("to-value-v").textContent;
      else if (currentTab === 3) text = document.getElementById("to-value-t").textContent;
      else if (currentTab === 4) text = document.getElementById("frac-result").textContent;

      if (text) {
        navigator.clipboard.writeText(text).then(() => alert("✅ Copied!"));
      }
    }

    function exportToPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(20);
      doc.text("Divisor Studio - Unit Converter", 20, 30);
      doc.setFontSize(14);
      let resultText = "Result: ";
      if (currentTab === 0) resultText += document.getElementById("to-value-l").textContent;
      else if (currentTab === 1) resultText += document.getElementById("to-value-w").textContent;
      else if (currentTab === 2) resultText += document.getElementById("to-value-v").textContent;
      else if (currentTab === 3) resultText += document.getElementById("to-value-t").textContent;
      doc.text(resultText, 20, 60);
      doc.text("© All Rights Reserved by Divisor Studio", 20, 100);
      doc.save("Divisor-Studio-Conversion.pdf");
    }

    function shareLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert("🔗 Link copied! Share kar sakte ho");
      });
    }

    // Initialize
    if (localStorage.getItem("darkMode") === "true") {
      document.documentElement.classList.add("dark");
      document.getElementById("theme-icon").classList.replace("fa-moon", "fa-sun");
    }

    // Default load
    window.onload = () => {
      convertLength();
    };
    // WhatsApp Share Function
    function shareOnWhatsApp() {
      const toolLink = window.location.href;
      const message = `Best MM to Inches + CM, Feet, Weight, Volume, Temperature Converter 🔥

Divisor Studio
Try karo yeh powerful tool!`;

      const encodedMessage = encodeURIComponent(message + "\n\n" + toolLink);
      const whatsappURL = `https://api.whatsapp.com/send?text=${encodedMessage}`;
      
      window.open(whatsappURL, '_blank');
    }
  </script>
</body>
</html>
